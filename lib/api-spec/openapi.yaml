openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.5.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: initiatives
    description: Innovation initiative operations
  - name: dashboard
    description: Dashboard aggregate operations
  - name: documents
    description: Document library operations
  - name: settings
    description: Admin settings operations
  - name: validations
    description: Validation review checklist operations
  - name: execution
    description: Execution domain — organizations, clients, programs, projects, milestones
  - name: governance
    description: Risks, approvals, and go-live readiness
  - name: portfolio
    description: Portfolio rollup across execution and governance data
  - name: resources
    description: Resources and capacity planning
  - name: reports
    description: Deterministic reporting engine and PDF export
paths:
  /initiative-brief/export/{format}:
    post:
      operationId: exportInitiativeBrief
      tags: [initiatives]
      summary: Generate a transient editable Word document or text-selectable PDF from a reviewed semantic Initiative Brief
      parameters:
        - in: path
          name: format
          required: true
          schema:
            type: string
            enum: [docx, pdf]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiativeBriefExportInput"
      responses:
        "200":
          description: Document attachment
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "400":
          description: Invalid or oversized model
  /jira/connection:
    get:
      operationId: getJiraConnection
      tags: [jira]
      responses:
        "200":
          description: Safe server configuration and latest test
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JiraConnection" }
  /jira/connection/test:
    post:
      operationId: testJiraConnection
      tags: [jira]
      responses:
        "200":
          description: Persisted test outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JiraConnection" }
  /jira/projects:
    get:
      operationId: listJiraProjects
      tags: [jira]
      responses:
        "200":
          description: Discovered projects including historical projects
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/JiraProject" } }
  /jira/projects/discover:
    post:
      operationId: discoverJiraProjects
      tags: [jira]
      responses:
        "200":
          description: Discovered projects
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/JiraProject" } }
  /jira/projects/{id}:
    patch:
      operationId: updateJiraProject
      tags: [jira]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JiraProjectInput" }
      responses:
        "200":
          description: Saved mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JiraProject" }
  /jira/fields:
    get:
      operationId: listJiraFields
      tags: [jira]
      responses:
        "200":
          description: Live system and custom field metadata
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/JiraField" } }
  /jira/issues/search:
    get:
      operationId: searchJiraIssues
      tags: [jira]
      summary: Search Jira work items live without storing issue data
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 255 } }
        - { name: projectKey, in: query, required: false, schema: { type: string, maxLength: 255 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 25, default: 25 } }
      responses:
        "200":
          description: Bounded live Jira search results
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/JiraWorkItem" } }
        "400":
          description: Invalid search parameters
        "503":
          description: Jira temporarily unavailable
  /jira/issues/{issueId}/intake-context:
    get:
      operationId: getJiraIssueIntakeContext
      tags: [jira]
      summary: Resolve a selected Jira issue and its bounded plain-text description for intake
      parameters:
        - { name: issueId, in: path, required: true, schema: { type: string, pattern: '^\d{1,30}$' } }
      responses:
        "200":
          description: Live read-only Jira issue context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JiraIntakeContext" }
        "400":
          description: Invalid Jira issue ID
        "404":
          description: Jira issue not found
        "503":
          description: Jira temporarily unavailable
  /jira/projects/{id}/field-mapping:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getJiraFieldMapping
      tags: [jira]
      responses:
        "200":
          description: Project field overrides
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JiraFieldMapping" }
    put:
      operationId: saveJiraFieldMapping
      tags: [jira]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JiraFieldMapping" }
      responses:
        "200":
          description: Saved field overrides
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JiraFieldMapping" }
  /jira/statuses:
    post:
      operationId: discoverJiraStatuses
      tags: [jira]
      responses:
        "200":
          description: Global default statuses; explicit mappings retained
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/JiraStatusMapping" } }
  /jira/status-mappings:
    get:
      operationId: listJiraStatusMappings
      tags: [jira]
      responses:
        "200":
          description: Global and project mappings
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/JiraStatusMapping" } }
    put:
      operationId: saveJiraStatusMapping
      tags: [jira]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JiraStatusMappingInput" }
      responses:
        "200":
          description: Saved status mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JiraStatusMapping" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /initiatives:
    get:
      operationId: listInitiatives
      tags: [initiatives]
      summary: List all initiatives
      responses:
        "200":
          description: A list of initiatives
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Initiative"
    post:
      operationId: createInitiative
      tags: [initiatives]
      summary: Create a new initiative
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiativeInput"
      responses:
        "201":
          description: Created initiative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
  /initiatives/{id}:
    get:
      operationId: getInitiative
      tags: [initiatives]
      summary: Get a single initiative
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The initiative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateInitiative
      tags: [initiatives]
      summary: Update an initiative
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiativeUpdate"
      responses:
        "200":
          description: Updated initiative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteInitiative
      tags: [initiatives]
      summary: Delete an initiative
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /initiatives/{id}/versions:
    get:
      operationId: listInitiativeVersions
      tags: [initiatives]
      summary: List version history for an initiative
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Version history entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InitiativeVersion"
  /initiatives/{id}/recommendations:
    get:
      operationId: getInitiativeRecommendations
      tags: [initiatives]
      summary: Get Initiative Intelligence recommendations
      description: >
        Deterministic, rule-based recommendations generated by the
        Initiative Intelligence Engine. The engine sits behind a provider
        abstraction so it can later be replaced by an AI-backed provider
        without changing this contract.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated recommendations for the initiative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitiativeRecommendations"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /initiatives/{id}/recalculate:
    post:
      operationId: recalculateInitiative
      tags: [initiatives]
      summary: Recalculate scoring, AI readiness, and priority from stored fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recalculation result with a detailed per-component change explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecalculationResult"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /initiatives/{id}/calculations:
    get:
      operationId: listCalculationEvents
      tags: [initiatives]
      summary: List the recalculation audit history for an initiative
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Calculation events, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalculationEvent"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /initiatives/{id}/compare:
    get:
      operationId: compareInitiativeVersions
      tags: [initiatives]
      summary: Compare the current version with the previous version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Side-by-side field comparison of current vs previous version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionComparison"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard aggregate metrics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List governance documents
      responses:
        "200":
          description: A list of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get admin configuration settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
  /settings/ai-provider/test:
    post:
      operationId: testAiProvider
      tags: [settings]
      summary: Run a readiness test against the active AI provider using sample data
      responses:
        "200":
          description: The stored test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderTestEvent"
  /settings/ai-provider/tests:
    get:
      operationId: listAiProviderTests
      tags: [settings]
      summary: List AI provider test history, newest first
      responses:
        "200":
          description: A list of provider test events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderTestEvent"
  /backlog:
    get:
      operationId: listBacklogItems
      tags: [backlog]
      summary: List product backlog items, newest first
      responses:
        "200":
          description: A list of backlog items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BacklogItem"
    post:
      operationId: createBacklogItem
      tags: [backlog]
      summary: Create a product backlog item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacklogItemCreate"
      responses:
        "201":
          description: Created backlog item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklogItem"
  /backlog/{id}:
    patch:
      operationId: updateBacklogItem
      tags: [backlog]
      summary: Update a product backlog item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacklogItemUpdate"
      responses:
        "200":
          description: Updated backlog item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklogItem"
        "404":
          description: Backlog item not found
    delete:
      operationId: deleteBacklogItem
      tags: [backlog]
      summary: Delete a product backlog item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Backlog item not found
  /parking-lot:
    get:
      operationId: listParkingLotItems
      tags: [backlog]
      summary: List parking lot items, newest first
      responses:
        "200":
          description: A list of parking lot items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParkingLotItem"
    post:
      operationId: createParkingLotItem
      tags: [backlog]
      summary: Create a parking lot item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParkingLotItemCreate"
      responses:
        "201":
          description: Created parking lot item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkingLotItem"
  /parking-lot/{id}:
    patch:
      operationId: updateParkingLotItem
      tags: [backlog]
      summary: Update a parking lot item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParkingLotItemUpdate"
      responses:
        "200":
          description: Updated parking lot item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkingLotItem"
        "404":
          description: Parking lot item not found
    delete:
      operationId: deleteParkingLotItem
      tags: [backlog]
      summary: Delete a parking lot item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Parking lot item not found
  /product-health:
    get:
      operationId: getProductHealth
      tags: [backlog]
      summary: Product health summary for the dashboard widget
      responses:
        "200":
          description: Product health counts and current version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductHealth"
  /environment:
    get:
      operationId: getEnvironmentStatus
      tags: [environment]
      summary: Environment status, setup flag, and record counts
      responses:
        "200":
          description: Current environment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentStatus"
  /environment/initialize:
    post:
      operationId: initializeEnvironment
      tags: [environment]
      summary: Run the System Initialization Wizard actions
      description: >
        Executes only the selected cleanup actions, marks first-time setup as
        complete, and records the run in the Environment History log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentInitializeRequest"
      responses:
        "201":
          description: The recorded environment initialization event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentEvent"
  /environment/history:
    get:
      operationId: listEnvironmentHistory
      tags: [environment]
      summary: Environment History log, newest first
      responses:
        "200":
          description: List of environment initialization events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnvironmentEvent"
  /validations:
    get:
      operationId: listValidations
      tags: [validations]
      summary: List validation records, newest first
      responses:
        "200":
          description: A list of validation records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ValidationRecord"
    post:
      operationId: createValidation
      tags: [validations]
      summary: Generate a validation checklist for the current application version
      description: >
        Creates a new validation record for the current application version,
        seeded from the built-in checklist templates covering every feature
        area of the app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationCreate"
      responses:
        "201":
          description: Created validation record with checklist items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationDetail"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /validations/{id}:
    get:
      operationId: getValidation
      tags: [validations]
      summary: Get a validation record with its checklist items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The validation record with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateValidation
      tags: [validations]
      summary: Update validation record header fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationUpdate"
      responses:
        "200":
          description: Updated validation record with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteValidation
      tags: [validations]
      summary: Delete a validation record and its items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /validations/{id}/items/{itemId}:
    patch:
      operationId: updateValidationItem
      tags: [validations]
      summary: Update a checklist item result or comments
      description: >
        Updating an item also re-derives the parent record's overall
        validation status and validation date server-side.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationItemUpdate"
      responses:
        "200":
          description: Parent validation record with items after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationDetail"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /organizations:
    get:
      operationId: listOrganizations
      tags: [execution]
      summary: List organizations
      responses:
        "200":
          description: A list of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
    post:
      operationId: createOrganization
      tags: [execution]
      summary: Create an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationCreate"
      responses:
        "201":
          description: Created organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
  /organizations/{id}:
    get:
      operationId: getOrganization
      tags: [execution]
      summary: Get an organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          description: Not found
    patch:
      operationId: updateOrganization
      tags: [execution]
      summary: Update an organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdate"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          description: Not found
    delete:
      operationId: deleteOrganization
      tags: [execution]
      summary: Delete an organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /clients:
    get:
      operationId: listClients
      tags: [execution]
      summary: List clients
      responses:
        "200":
          description: A list of clients
          content:
