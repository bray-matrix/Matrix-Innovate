      operationId: getReportPdf
      tags: [reports]
      summary: Export a report as PDF (same report model as web)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: projectId
          in: query
          required: false
          schema:
            type: integer
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
        - name: programId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Missing/invalid scope
        "404":
          description: Unknown report
  /dashboard/execution-summary:
    get:
      operationId: getExecutionSummary
      tags: [dashboard]
      summary: Execution summary for the dashboard (projects + unpromoted approved initiatives)
      responses:
        "200":
          description: Execution summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionSummary"
